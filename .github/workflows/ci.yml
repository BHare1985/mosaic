# CI is a thin wrapper over scripts/ci.sh: the same command a developer runs, so a green here means what a
# green locally means. The matrix covers crypto on/off x ZeroMQ on/off, plus sanitizers and the format check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang-format
      - name: Run the full check
        run: ./scripts/ci.sh

  weekly-ecosystem:
    # Only on the schedule: libzmq, czmq and malamute from their pinned refs, to notice when the
    # surrounding ecosystem stops compiling. Findings go to docs/upstream-notes.md, never upstream (D4).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: ZeroMQ stack from source
        run: cmake -S all -B build && cmake --build build -j && ./build/all/test/MosaicTests
